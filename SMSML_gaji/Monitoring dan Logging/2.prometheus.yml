global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ML Model Metrics Exporter
  - job_name: 'ml_model_exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:8001']
        labels:
          service: 'wine-quality-model'
          environment: 'local'
          author: 'gaji'
    metrics_path: '/metrics'
