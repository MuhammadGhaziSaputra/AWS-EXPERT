name: ML Training CI Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'MLProject/**'
  workflow_dispatch:
    inputs:
      n_estimators:
        description: 'Number of trees'
        required: false
        default: '200'
      max_depth:
        description: 'Max depth of trees'
        required: false
        default: '10'

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: mlflow-env
          python-version: '3.12.7'
          auto-activate-base: false

      - name: Check Env
        run: |
          echo "Python version:"
          python --version
          echo "Pip version:"
          pip --version
          echo "Working directory:"
          pwd
          echo "MLProject contents:"
          ls -la MLProject/

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn pandas numpy matplotlib seaborn

      - name: Run mlflow project
        working-directory: MLProject
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          mlflow run . \
            -P n_estimators=${{ github.event.inputs.n_estimators || '200' }} \
            -P max_depth=${{ github.event.inputs.max_depth || '10' }} \
            -P min_samples_split=5 \
            -P min_samples_leaf=2 \
            -P data_dir=breast_cancer_preprocessing \
            --env-manager=local

      - name: Get latest MLflow run_id
        working-directory: MLProject
        run: |
          echo "MLflow runs directory:"
          ls -la mlruns/ 2>/dev/null || echo "No mlruns directory"
          echo ""
          echo "Experiment directories:"
          find mlruns/ -name "meta.yaml" -type f 2>/dev/null | head -20 || echo "No meta files found"

      - name: Upload model artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ml-model-artifacts
          path: |
            MLProject/mlruns/
          retention-days: 30

      - name: Save model artifacts to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Create artifacts directory
          mkdir -p saved_artifacts
          
          # Copy latest model artifacts
          if [ -d "MLProject/mlruns" ]; then
            cp -r MLProject/mlruns saved_artifacts/
          fi
          
          git add saved_artifacts/
          git diff --staged --quiet || git commit -m "Auto-save model artifacts from CI [skip ci]"
          git push

      - name: Job Summary
        run: |
          echo "## 🎉 CI Pipeline Completed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Details" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ MLflow Project executed successfully" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Model artifacts saved to repository" >> $GITHUB_STEP_SUMMARY
          echo "- Parameters: n_estimators=${{ github.event.inputs.n_estimators || '200' }}, max_depth=${{ github.event.inputs.max_depth || '10' }}" >> $GITHUB_STEP_SUMMARY
